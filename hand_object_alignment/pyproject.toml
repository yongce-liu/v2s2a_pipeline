[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hand_object_alignment"
version = "0.1.0"
description = "Validated corrective hand-object trajectory alignment for v2s2a_pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "trimesh>=4.0.0",
  "tyro>=1.0.13",
  "loguru>=0.7.3",
]

[project.scripts]
hand_object_alignment = "hand_object_alignment.cli:main"

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff", "uv"]

[tool.hatch.build.targets.wheel]
packages = ["hand_object_alignment"]

[tool.hatch.build.targets.sdist]
packages = ["hand_object_alignment"]

[tool.uv]
required-version = ">=0.11.3"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
exclude = ["pkgs", ".venv", "build", "dist"]
line-length = 88
lint.extend-ignore = ["E203", "E266", "E501"]
