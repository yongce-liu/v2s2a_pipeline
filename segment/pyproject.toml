[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "segment"
version = "0.1.0"
description = "SAM3 hand-mask segmentation for EgoDataPipe selected frames"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy==1.26.4",
  "opencv-python>=4.8.0",
  "pillow>=10.0.0",
  "setuptools<82",
  "einops>=0.7.0",
  "iopath>=0.1.10",
  "psutil>=5.9.0",
  "pycocotools>=2.0.11",
  "timm>=1.0.17",
  "triton>=3.0.0; platform_machine == 'x86_64'",
  "tyro>=1.0.13",
  "loguru>=0.7.3",
  "sam3",
  "torch==2.10.0+cu128",
  "torchvision==0.25.0+cu128",
]

[project.scripts]
segment = "segment.cli:main"

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff", "uv"]

[tool.hatch.build.targets.wheel]
packages = ["segment"]

[tool.hatch.build.targets.sdist]
packages = ["segment"]

[tool.uv]
required-version = ">=0.11.3"
index-strategy = "unsafe-best-match"

[tool.uv.sources]
sam3 = {
  git = "https://github.com/facebookresearch/sam3.git",
  rev = "8f0b7f4d4e7eda2ed606ebde6702c93359ad01da",
}
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
exclude = ["pkgs", ".venv", "build", "dist"]
line-length = 88
lint.extend-ignore = ["E203", "E266", "E501"]
