[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "v2s2a-rl"
version = "0.1.0"
description = "Trajectory-conditioned dexterous manipulation RL for v2s2a, built on Isaac Lab and RSL-RL"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pyyaml>=6",
  "tyro>=0.9",
]

[project.optional-dependencies]
# v3.0.0-beta2 was tagged before its monolithic wheel reached public PyPI.
# Pin every runtime component to the immutable upstream beta commit instead
# of accidentally resolving the incompatible 2.x wheel.
isaaclab = [
  "isaacsim[all,extscache]==6.0.0.1",
  "isaaclab @ git+https://github.com/isaac-sim/IsaacLab.git@28a37cecdd433c22d9eabd6a5954add9f13a8951#subdirectory=source/isaaclab",
  "isaaclab-assets @ git+https://github.com/isaac-sim/IsaacLab.git@28a37cecdd433c22d9eabd6a5954add9f13a8951#subdirectory=source/isaaclab_assets",
  "isaaclab-physx @ git+https://github.com/isaac-sim/IsaacLab.git@28a37cecdd433c22d9eabd6a5954add9f13a8951#subdirectory=source/isaaclab_physx",
  "isaaclab-rl[rsl-rl] @ git+https://github.com/isaac-sim/IsaacLab.git@28a37cecdd433c22d9eabd6a5954add9f13a8951#subdirectory=source/isaaclab_rl",
  "isaaclab-tasks @ git+https://github.com/isaac-sim/IsaacLab.git@28a37cecdd433c22d9eabd6a5954add9f13a8951#subdirectory=source/isaaclab_tasks",
  "torch==2.11.0",
  "torchvision==0.26.0",
]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
v2s2a-rl = "v2s2a_rl.cli:main"
v2s2a-rl-prepare = "v2s2a_rl.cli:prepare_main"

[tool.hatch.build.targets.wheel]
packages = ["v2s2a_rl"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
required-version = ">=0.11.0"
prerelease = "allow"
index-strategy = "unsafe-best-match"
# The tagged beta source still declares its development coverage pin (7.6.1),
# while Isaac Sim 6.0.0.1 pins 7.4.4. Coverage is not used at runtime.
override-dependencies = ["coverage==7.4.4", "packaging==26.0"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
lint.select = ["E4", "E7", "E9", "F", "I"]
