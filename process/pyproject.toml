[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "process"
version = "0.1.0"
description = "Video ingestion: ffprobe format detection and frame extraction for v2r_pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "tyro>=1.0.13",
  "loguru>=0.7.3",
]

[project.scripts]
process = "process.cli:main"

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff", "uv"]

[tool.hatch.build.targets.wheel]
packages = ["process"]

[tool.hatch.build.targets.sdist]
packages = ["process"]

[tool.uv]
required-version = ">=0.11.3"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
exclude = ["pkgs", ".venv", "build", "dist"]
line-length = 88
lint.extend-ignore = ["E203", "E266", "E501"]
